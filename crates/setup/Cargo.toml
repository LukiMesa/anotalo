[package]
name = "anotalo-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anotalo-core = { path = "../core" }
anotalo-winsys = { path = "../winsys" }
chrono = "0.4"
log = "0.4"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Registry"] }
