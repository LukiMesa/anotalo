[package]
name = "anotalo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anotalo"
path = "src/main.rs"

[dependencies]
anotalo-core = { path = "../core" }
anotalo-whisper = { path = "../whisper" }
anotalo-winaudio = { path = "../winaudio" }
fontdue = "0.9"
hound = "3"
log = "0.4"
tiny-skia = "0.11"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
regex = "1"
serde_json = "1"
tempfile = "3"
unicode-normalization = "0.1"
