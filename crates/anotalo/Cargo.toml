[package]
name = "anotalo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anotalo"
path = "src/main.rs"

[dependencies]
anotalo-core = { path = "../core" }
anotalo-setup = { path = "../setup" }
anotalo-whisper = { path = "../whisper" }
anotalo-winaudio = { path = "../winaudio" }
anotalo-winsys = { path = "../winsys" }
chrono = "0.4"
fontdue = "0.9"
hound = "3"
log = "0.4"
serde_json = "1"
tiny-skia = "0.11"
# La página en WebView2 (spec §5.6): wry, la capa de webview de Tauri, sobre nuestra ventana Win32.
# webview2-com: los ajustes de WebView2 que wry no expone (ICoreWebView2Settings9).
# Su webview2-com-sys es la copia de third_party/ (ver el [patch] de la raíz), sin el cargador de
# Microsoft: el entorno lo crea anotalo-winsys (webview2_loader.rs).
webview2-com = "0.39"
wry = { version = "0.57", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
regex = "1"
tempfile = "3"
unicode-normalization = "0.1"
