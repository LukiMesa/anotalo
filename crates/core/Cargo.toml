[package]
name = "anotalo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anotalo-whisper = { path = "../whisper" }
audioadapter-buffers = "5.1"
chrono = "0.4"
hound = "3"
log = "0.4"
regex = "1"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tract-onnx = "=0.23.10"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
hound = "3"
serde_json = "1"
tempfile = "3"
