# Anotalo (Rust): compila, prueba y comprueba anotalo.exe en Windows y sube el exe sin firmar;
# prueba el instalador de punta a punta (setup-e2e) y, en una etiqueta v<x.y.z-pre>, publica la
# pre-release (release). Las etiquetas no pasan por los filtros de paths.
# La firma con SignPath llega en M5, en este mismo workflow.
name: Anotalo

on:
  push:
    branches: ["**"]
    tags: ["v[1-9]*"]
    paths:
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "scripts/check-deps.ps1"
      - "scripts/get-test-model.ps1"
      - "scripts/fixtures/**"
      - "scripts/test-setup-e2e.ps1"
      - "scripts/publish-release.ps1"
      - "calltx/updater.py"
      - ".github/release-notes/**"
      - "bench/**"
      - ".github/workflows/anotalo.yml"
  pull_request:
    paths:
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "scripts/check-deps.ps1"
      - "scripts/get-test-model.ps1"
      - "scripts/fixtures/**"
      - "scripts/test-setup-e2e.ps1"
      - "scripts/publish-release.ps1"
      - "calltx/updater.py"
      - ".github/release-notes/**"
      - "bench/**"
      - ".github/workflows/anotalo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anotalo-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_VERSION: "1.4.363.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalador del Vulkan SDK (caché)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vulkan
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}

      - name: Instalar el Vulkan SDK
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "vulkan"
          $exe = Join-Path $dir "vulkan_sdk.exe"
          if (-not (Test-Path $exe)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan_sdk.exe" -OutFile $exe
          }
          $root = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $p = Start-Process $exe -ArgumentList "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador del Vulkan SDK terminó con $($p.ExitCode)" }
          "VULKAN_SDK=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$root\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Rust (versión de rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Modelos de prueba (caché)
        uses: actions/cache@v4
        with:
          path: |
            target\models\ggml-tiny.bin
            target\models\nemo_en_titanet_small.onnx
          key: test-models-v2

      - name: Descargar los modelos de prueba
        shell: pwsh
        run: .\scripts\get-test-model.ps1

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release --workspace --no-fail-fast

      - name: Compilar (exe y bench)
        run: |
          cargo build --release
          cargo build --release -p anotalo --example bench

      - name: Dependencias de los exe (CRT estático, Vulkan diferido, DLL solo de System32)
        shell: pwsh
        run: .\scripts\check-deps.ps1 -Exe target\release\anotalo.exe,target\release\examples\bench.exe

      - name: Autodiagnóstico (sin GPU en el runner)
        shell: pwsh
        run: |
          $out = & target\release\anotalo.exe selftest --model target\models\ggml-tiny.bin --wav third_party\whisper.cpp\samples\jfk.wav | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "selftest terminó con $LASTEXITCODE" }
          if ($out -notmatch "ask not what your country") { throw "la transcripción no es la esperada" }
          # Un whisper.cpp sin optimizar tardaba ~20 s aquí; optimizado, unos pocos segundos.
          if ($out -notmatch "Tiempo: ([0-9.]+) s") { throw "falta la línea Tiempo" }
          if ([double]$matches[1] -gt 8) { throw "selftest demasiado lento ($($matches[1]) s): ¿whisper.cpp sin optimizar?" }

      - name: Versión y datos del exe
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = @($meta.packages | Where-Object { $_.name -eq "anotalo" })[0].version
          "Versión de Cargo: $version"
          # una etiqueta publica exactamente la versión del exe
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$version" -cne $env:GITHUB_REF_NAME) {
            throw "La etiqueta $env:GITHUB_REF_NAME no es v$version (la versión de Cargo.toml)"
          }
          # lo que muestran Windows y SignPath (spec §5.8)
          $info = (Get-Item target\release\anotalo.exe).VersionInfo
          $want = [ordered]@{ ProductName = "Anotalo"; CompanyName = "LukiMesa"; FileDescription = "Anotalo"; ProductVersion = $version }
          foreach ($k in $want.Keys) {
            if ($info.$k -cne $want[$k]) { throw "anotalo.exe: $k es '$($info.$k)', se esperaba '$($want[$k])'" }
            "  ${k}: $($info.$k)"
          }
          # la vcomp140.dll que el exe lleva dentro e instala junto a Anotalo.exe, con su firma
          $sig = Get-AuthenticodeSignature target\release\vcomp140.dll
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "vcomp140.dll: firma $($sig.Status) ($($sig.SignerCertificate.Subject))"
          }
          "  vcomp140.dll: $($sig.Status), $($sig.SignerCertificate.Subject)"
          .\scripts\publish-release.ps1 -DryRun -Exe target\release\anotalo.exe -Tag "v$version"

      - uses: actions/upload-artifact@v4
        with:
          name: anotalo-exe
          path: |
            target\release\anotalo.exe
            target\release\vcomp140.dll
          retention-days: 14
          if-no-files-found: error

  no-vulkan-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anotalo-exe
          path: dist

      - name: Modelo y audio de prueba
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin" -OutFile dist\ggml-tiny.bin
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/ggml-org/whisper.cpp/d1be6fde11ac6e0407606b4e42fe72d34add8037/samples/jfk.wav" -OutFile dist\jfk.wav

      - name: Arranca y transcribe sin Vulkan ni el OpenMP del sistema
        shell: pwsh
        run: |
          # El runner trae vulkan-1.dll y vcomp140.dll (Visual Studio): se quitan de verdad (la
          # máquina es desechable) para probar el camino real de un PC sin driver de GPU y sin el
          # VC++ redist. vcomp140.dll debe salir de dist\, junto al exe.
          foreach ($dll in "C:\Windows\System32\vulkan-1.dll", "C:\Windows\System32\vcomp140.dll") {
            if (Test-Path $dll) {
              takeown /f $dll | Out-Null
              icacls $dll /grant "*S-1-5-32-544:F" | Out-Null
              Remove-Item -Force $dll
            }
            if (Test-Path $dll) { throw "no se pudo quitar $dll" }
          }
          if (-not (Test-Path dist\vcomp140.dll)) { throw "falta vcomp140.dll junto al exe en el artefacto" }
          $out = & dist\anotalo.exe selftest --model dist\ggml-tiny.bin --wav dist\jfk.wav | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "selftest terminó con $LASTEXITCODE" }
          if ($out -notmatch "Vulkan: no disponible") { throw "esperaba 'Vulkan: no disponible'" }
          if ($out -notmatch "ask not what your country") { throw "la transcripción no es la esperada" }

  # Instala de verdad en el runner (desechable): Transcriptor 0.6.4 → Anotalo con el código de
  # actualización de 0.6.4, actualización con la app abierta y desinstalación (spec §5.8, §7).
  setup-e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: anotalo-exe
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuera de CI, la prueba no corre
        shell: pwsh
        run: |
          $out = pwsh -NoProfile -Command 'try { $env:GITHUB_ACTIONS = "false"; & ./scripts/test-setup-e2e.ps1 -Setup dist\anotalo.exe; exit 0 } catch { $_.Exception.Message; exit 3 }' | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -ne 3 -or $out -notmatch "Solo en CI") { throw "test-setup-e2e.ps1 no se negó a correr sin GITHUB_ACTIONS=true ni -ThisPcIsDisposable (código $code)" }
          foreach ($p in "$env:APPDATA\CallTranscriber", "C:\e2e") {
            if (Test-Path $p) { throw "test-setup-e2e.ps1 creó $p antes de negarse" }
          }
          "Se negó, como debe."
          exit 0 # si no, el paso acaba con el código del pwsh de dentro (3)

      - name: Transcriptor 0.6.4 → Anotalo, actualización con la app abierta y desinstalación
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\test-setup-e2e.ps1 -Setup dist\anotalo.exe

  # Una etiqueta v<x.y.z-pre> publica Anotalo-Setup-<versión>.exe como pre-release sin firmar
  # (nunca /releases/latest: Transcriptor 0.6.x no la ve). Una estable se publica firmada (M5).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, no-vulkan-smoke, setup-e2e]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: anotalo-exe
          path: dist

      - name: Publicar la pre-release (sin firmar)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # la etiqueta por el entorno, no dentro del script (publish-release.ps1 la valida)
        run: .\scripts\publish-release.ps1 -Exe dist\anotalo.exe -Tag $env:GITHUB_REF_NAME
