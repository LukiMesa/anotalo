# CRT estático: el exe no depende de MSVCP*/VCRUNTIME*/UCRT (spec §5.1).
# vulkan-1.dll de carga diferida en TODOS los binarios (exe, ejemplos, tests): en un PC sin driver
# de GPU arrancan igual y usan la CPU. En los que no usan whisper el enlazador avisa LNK4199: es normal.
# /DEPENDENTLOADFLAG:0x800 (LOAD_LIBRARY_SEARCH_SYSTEM32): las DLL que importa el exe se cargan solo
# de System32. Sin esto, una propsys.dll o mmdevapi.dll dejada junto al exe (no son KnownDLLs) se
# cargaría en su lugar (tests/dll_planting.rs de anotalo).
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/DELAYLOAD:vulkan-1.dll",
    "-C", "link-arg=delayimp.lib",
    "-C", "link-arg=/DEPENDENTLOADFLAG:0x800",
]
